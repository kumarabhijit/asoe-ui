# TypeScript type-check gate.
#
# Runs `tsc --noEmit` on every PR + push to main. Catches contract drift
# (UI types vs asoe2 backend), schema drift on generated OpenAPI types,
# and stale test fixtures the way `next build` cannot — `next build`
# only type-checks the files in the src/ graph it actually compiles, so
# tests/ never sees the type-checker without an explicit gate.
#
# This workflow is the follow-up promised in PR B's body: now that the
# clean baseline (0 errors) has been established, this gate makes
# regression visible immediately rather than letting it accumulate
# silently as it did between PR #128 and PR #131 (791 errors at peak).

name: Typecheck

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/typecheck.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck
