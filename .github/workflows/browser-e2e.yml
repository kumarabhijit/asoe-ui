# Browser-driven end-to-end tests (Playwright).
#
# Spins up the asoe2 backend (SQLite/in-memory sandbox) and asoe-ui dev
# server, drives real Chromium against them, and publishes the
# Playwright HTML report + trace/video/screenshot artifacts on failure.
#
# This workflow lives in asoe-ui because the specs live here. It clones
# asoe2 as a sibling working directory since the asoe-ui Playwright
# config's webServer block launches uvicorn via a relative path.
name: Browser E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.ts'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same PR/ref —
# Playwright is the heaviest job, so superseded runs are pure waste.
concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout asoe-ui
        uses: actions/checkout@v4
        with:
          path: asoe-ui

      # Cross-repo PRs frequently land paired changes (a UI test that
      # asserts new backend behaviour, etc.). Always checking out
      # asoe2/main means the UI CI runs against a backend that's still
      # missing the matching change, breaking on legitimate work-in-
      # progress. Resolve to a same-named feature branch on asoe2
      # when one exists, fall back to main otherwise. github.head_ref
      # is the source branch of the PR (empty on workflow_dispatch /
      # push events, in which case we fall through to main).
      - name: Resolve asoe2 ref (matching branch or main)
        id: asoe2_ref
        env:
          GH_TOKEN: ${{ secrets.ASOE2_READ_TOKEN || github.token }}
        run: |
          BRANCH="${{ github.head_ref }}"
          REPO="${{ github.repository_owner }}/asoe2"
          if [ -n "$BRANCH" ] \
             && gh api "repos/$REPO/branches/$BRANCH" >/dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "Using asoe2 branch '$BRANCH' (matched the PR head)."
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            if [ -z "$BRANCH" ]; then
              echo "No PR head_ref; using asoe2 'main'."
            else
              echo "asoe2 has no branch '$BRANCH'; falling back to 'main'."
            fi
          fi

      - name: Checkout asoe2 (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/asoe2
          ref: ${{ steps.asoe2_ref.outputs.ref }}
          path: asoe2
          token: ${{ secrets.ASOE2_READ_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: asoe-ui/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install asoe-ui dependencies
        working-directory: asoe-ui
        run: npm ci --no-audit --no-fund

      - name: Install asoe2 dependencies
        working-directory: asoe2
        run: |
          python -m pip install --upgrade pip
          # asoe2 uses pyproject.toml — there is no top-level
          # requirements.txt. Install the package + its optional dev
          # extras so uvicorn and the langgraph runtime resolve
          # exactly the way the asoe2 test suite does.
          pip install -e ".[dev]"

      - name: Resolve Playwright version (cache key)
        id: pw
        working-directory: asoe-ui
        run: |
          PW_VERSION=$(node -e 'console.log(require("@playwright/test/package.json").version)')
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers (cache miss → download + OS deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: asoe-ui
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit → no download)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: asoe-ui
        run: npx playwright install-deps chromium

      - name: Run browser e2e tests
        working-directory: asoe-ui
        env:
          CI: '1'
          ASOE2_ROOT: ../asoe2
        run: npm run test:browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: asoe-ui/playwright-report/
          retention-days: 14

      - name: Upload test-results (traces, videos, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: asoe-ui/test-results/
          retention-days: 7
