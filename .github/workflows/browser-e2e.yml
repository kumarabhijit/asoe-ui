# Browser-driven end-to-end tests (Playwright).
#
# Spins up the asoe2 backend (SQLite/in-memory sandbox) and asoe-ui dev
# server, drives real Chromium against them, and publishes the
# Playwright HTML report + trace/video/screenshot artifacts on failure.
#
# This workflow lives in asoe-ui because the specs live here. It clones
# asoe2 as a sibling working directory since the asoe-ui Playwright
# config's webServer block launches uvicorn via a relative path.
name: Browser E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.ts'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout asoe-ui
        uses: actions/checkout@v4
        with:
          path: asoe-ui

      - name: Checkout asoe2 (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/asoe2
          ref: main
          path: asoe2
          token: ${{ secrets.ASOE2_READ_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: asoe-ui/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install asoe-ui dependencies
        working-directory: asoe-ui
        run: npm ci --no-audit --no-fund

      - name: Install asoe2 dependencies
        working-directory: asoe2
        run: |
          python -m pip install --upgrade pip
          # asoe2 uses pyproject.toml — there is no top-level
          # requirements.txt. Install the package + its optional dev
          # extras so uvicorn and the langgraph runtime resolve
          # exactly the way the asoe2 test suite does.
          pip install -e ".[dev]"

      - name: Install Playwright browsers
        working-directory: asoe-ui
        run: npx playwright install --with-deps chromium

      - name: Run browser e2e tests
        working-directory: asoe-ui
        env:
          CI: '1'
          ASOE2_ROOT: ../asoe2
        run: npm run test:browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: asoe-ui/playwright-report/
          retention-days: 14

      - name: Upload test-results (traces, videos, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: asoe-ui/test-results/
          retention-days: 7
