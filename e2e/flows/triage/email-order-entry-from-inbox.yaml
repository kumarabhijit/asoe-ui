# triage/email-order-entry-from-inbox.yaml — regression, V1, J1.
#
# Closes V1 from eng-review-test-plan.md amendment v1.1:
#   "Context-aware navigation: opening a case from the customer
#    inbox routes to the exception page, but the exception page
#    only offers 'Back to queue', not 'Back to customer inbox'.
#    Entry-path context is lost."
#
# Issue #133, PO #9 — the original /inbox surface that produced
# the V1 bug is retired. The CONTRACT V1 enforces — "the detail
# page's back-target is contextual, sourced from the ?from=
# query — still holds. The post-#133 verification path:
#
#   1. Navigate directly to /exceptions/{id}?from=inbox.
#   2. Assert "Back to Inbox" affordance renders (the BACK_TARGETS
#      map in /exceptions/[id]/page.tsx maps inbox -> /inbox label
#      "Back to Inbox", preserved as a referrer alias).
#   3. Click it; land on /inbox, which server-redirects to
#      /cases?source=manual_order.
#   4. Assert the operator ends on /cases?source=manual_order
#      (the canonical manual-order case list — Issue #133's
#      replacement for the legacy inbox).
#
# Why test the alias path rather than the original user journey?
#   - The original journey ("operator on /inbox, clicks email-order-
#     entry row, lands on /exceptions/{id}") no longer exists —
#     /inbox is a redirect. Re-targeting through the redirect would
#     test redirect plumbing, not the back-target contract.
#   - The alias path EXERCISES the back-target contract V1
#     was authored to lock down. If a future refactor breaks the
#     ?from=inbox -> "Back to Inbox" mapping, this test fails.
#   - Operators reaching /exceptions/{id}?from=inbox still happens
#     today via cross-app deep-links and saved bookmarks.
name: email-order-entry-from-inbox
kind: regression
journey: J1
arc: task-completion
authAs: MANAGER
entry: /exceptions/exc-026?from=inbox
steps:
  # Step 1 — landed on the detail with ?from=inbox in the URL.
  # The page reads search params via useSearchParams() and
  # surfaces the inbox-aware Back affordance.
  - action: assert_visible
    selector: 'text="Back to Inbox"'

  # Step 2 — focus is on the heading after a navigation (D6
  # focus restoration on navigation). The detail page renders an
  # h1 / role="heading" with aria-level=1 once content loads.
  - action: assert_focus_on
    selector: 'h1, [role="heading"][aria-level="1"]'

  # Step 3 — click Back to Inbox. Sends the operator to /inbox
  # which is a server redirect into /cases?source=manual_order.
  - action: click
    selector: 'text="Back to Inbox"'
    keyboard_equivalent:
      key: Enter
      focused_selector: 'text="Back to Inbox"'

  # Step 4 — final URL is the redirect target. If the redirect
  # ever breaks (e.g. someone edits /inbox/page.tsx to render
  # content instead of redirecting), the operator lands on /inbox
  # and this assertion fails loud.
  - action: assert_url_equals
    url: /cases?source=manual_order
