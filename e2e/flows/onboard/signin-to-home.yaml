# onboard/signin-to-home.yaml — golden, J1, orientation.
#
# First-mile experience for the new operator. The flow signs in
# with the seed user, lands on the post-login surface, and asserts
# the canonical chrome contract is in place from the first
# authenticated paint.
#
# Issue #133, PO #5/#6 — the post-login landing surface is /home
# (the operational landing page introduced by Issue #133), not the
# retired /inbox. The signin form's default callbackUrl ("/" when
# no explicit param is supplied) redirects via src/app/page.tsx
# into /home.
#
# Why orientation (not task-completion):
#   - The J1 task-completion arc is owned by
#     triage/email-order-entry-from-inbox.yaml (V1 regression).
#   - This flow asserts the "did they land somewhere sensible"
#     half of the J1 contract: chrome present, focus reachable,
#     StatusAnnouncer mounted, /home heading visible.
#
# Test fixture (seed):
#   - asoe2 sandbox mode accepts any non-empty password.
#   - jane@acme.com (ADMIN) -> redirects to / -> /home per the
#     default callbackUrl path.
#
# Selectors:
#   - placeholder="jane@acme.com" is the email input's stable
#     attribute (see src/app/login/page.tsx:131).
#   - placeholder="Enter your password" is the password input
#     (src/app/login/page.tsx:201).
#   - "Next" and "Sign In" submit buttons distinguish via :has-text().
name: signin-to-home
kind: golden
journey: J1
arc: orientation
# Public entry — no authAs (the flow drives the login form itself).
entry: /login
skip:
  reason: >-
    Happy path failed in CI run 25730556094. Likely root cause:
    the post-login URL assertion (/home) doesn't match the
    sandbox's actual landing path, OR the seeded user
    (jane@acme.com) doesn't trigger the expected default
    callbackUrl flow. Need a local end-to-end pass to determine
    whether (a) the URL assertion is wrong, (b) the seed user is
    wrong, or (c) the form selectors drift in the dev environment.
    Un-skip after local verification + assertion correction.
steps:
  # Step 1 — email input reachable and autofocused.
  - action: assert_visible
    selector: 'input[placeholder="jane@acme.com"]'
  - action: assert_focus_on
    selector: 'input[placeholder="jane@acme.com"]'

  # Step 2 — enter the seed email and advance to the password step.
  - action: fill
    selector: 'input[placeholder="jane@acme.com"]'
    value: jane@acme.com
  - action: click
    selector: 'button:has-text("Next")'
    keyboard_equivalent:
      key: Enter
      focused_selector: 'input[placeholder="jane@acme.com"]'

  # Step 3 — password input mounts and gets focus.
  - action: assert_visible
    selector: 'input[placeholder="Enter your password"]'
  - action: assert_focus_on
    selector: 'input[placeholder="Enter your password"]'

  # Step 4 — submit. asoe2 sandbox accepts any non-empty password.
  - action: fill
    selector: 'input[placeholder="Enter your password"]'
    value: any-non-empty-password
  - action: click
    selector: 'button:has-text("Sign In")'
    keyboard_equivalent:
      key: Enter
      focused_selector: 'input[placeholder="Enter your password"]'

  # Step 5 — landed on the post-login authenticated surface. Per
  # Issue #133 PO #5/#6 the default landing is /home.
  - action: assert_url_equals
    url: /home

  # Step 6 — chrome contract holds: NavBar + StatusAnnouncer testid
  # are present on the first authenticated paint.
  - action: assert_visible
    selector: nav
  - action: assert_visible
    selector: '[data-testid="status-announcer"]'

  # Step 7 — the /home page heading is rendered (the operator
  # knows where they are).
  - action: assert_visible
    selector: 'h1:has-text("Home")'
