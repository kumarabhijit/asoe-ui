# recover/back-from-misroute.yaml — golden, J3, orientation.
#
# Issue #133, PO #9 — the rich /inbox master-detail surface (where
# the original "misclick recovery" scenario lived as a right-pane
# selection switch) was retired. The J3 orientation arc adapts to
# the post-#133 surface: the operator navigates from /cases into a
# case detail (the misroute), realises they want a different case,
# and recovers via the back affordance without losing their place
# in the case list.
#
# Pre-#133 contract: misclick = wrong inbox row selection; recovery =
# click a different row, URL stays /inbox. Master-detail local
# selection swap.
#
# Post-#133 contract: misclick = navigated into wrong case detail;
# recovery = browser-back or "Back to Cases" affordance, lands at
# /cases with the filter / scroll preserved. Multi-step but
# orientation-shaped (no data entered yet).
#
# The "Back to Cases" affordance on /cases/[id] is a literal Link
# ("← All cases" — see src/app/cases/[id]/page.tsx:92). The test
# asserts both:
#   1. The affordance is reachable from any case detail.
#   2. Clicking it lands the operator back at /cases (preserves
#      the source filter when present).
name: back-from-misroute
kind: golden
journey: J3
arc: orientation
authAs: MANAGER
entry: /cases?source=manual_order
states:
  - empty
  # Other states opt-out: this flow asserts the navigation
  # recovery contract, not the list state-matrix.
state_fixtures:
  empty:
    route: /api/v1/cases**
    body:
      items: []
      total: 0
      cursor: null
      has_more: false
    assert_text_contains:
      - "No cases match the current filters."
steps:
  # Step 1 — landed on the manual-order case list; cases visible.
  - action: assert_visible
    selector: 'button[aria-label^="Open case "]'

  # Step 2 — operator misclicks into the first case. The post-click
  # URL pattern matches /cases/{some-id}; we don't bind to a
  # specific seeded id since the sandbox seed may evolve.
  - action: click
    selector: 'button[aria-label^="Open case "] >> nth=0'
    keyboard_equivalent:
      key: Enter
      focused_selector: 'button[aria-label^="Open case "] >> nth=0'
  - action: assert_url_matches
    pattern: ^/cases/[^/?#]+$

  # Step 3 — "← All cases" link is the recovery affordance on
  # /cases/[id]. src/app/cases/[id]/page.tsx:92 renders it with
  # aria-label="Back to cases list".
  - action: assert_visible
    selector: '[aria-label="Back to cases list"]'

  # Step 4 — recover. The operator clicks the back affordance and
  # lands back at /cases. The source filter is dropped by the
  # back-link (it pushes to /cases without query); a follow-up
  # PR can teach the back-link to preserve the filter. Documenting
  # the current behaviour rather than aspirational.
  - action: click
    selector: '[aria-label="Back to cases list"]'
    keyboard_equivalent:
      key: Enter
      focused_selector: '[aria-label="Back to cases list"]'
  - action: assert_url_equals
    url: /cases
